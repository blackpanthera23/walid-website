<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Poliklinik Walid">
  <!-- Navy circular emblem (faithful recreation of the brand mark).
       Replace with the official logo file when supplied. -->
  <defs>
    <clipPath id="circle"><circle cx="100" cy="100" r="92"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#232B8F"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#161B5E" stroke-width="2"/>
  <!-- inner ring accent -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <!-- stylised calligraphic strokes in white (abstracted) -->
  <g clip-path="url(#circle)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- flowing leaf/wa stroke -->
    <path d="M128 48 C150 70 150 120 120 140 C104 150 92 142 96 126 C100 112 120 110 126 96"
          stroke-width="11"/>
    <!-- lower curl -->
    <path d="M70 150 C86 150 96 140 96 126" stroke-width="11"/>
    <!-- left character strokes -->
    <path d="M60 86 C74 80 92 84 96 96" stroke-width="10"/>
    <path d="M58 110 C66 104 82 104 90 112" stroke-width="10"/>
    <path d="M66 74 C78 70 92 72 98 80" stroke-width="9"/>
    <!-- dots -->
    <circle cx="112" cy="150" r="4" fill="#ffffff" stroke="none"/>
  </g>
</svg>
